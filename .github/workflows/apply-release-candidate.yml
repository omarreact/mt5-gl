name: Apply MetaGreyLabel release candidate

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    if: contains(github.event.head_commit.message, '[stage-rc]')
    runs-on: ubuntu-latest
    steps:
      - name: Check out staged main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract verified release bundle
        run: |
          rm -rf .release/unpacked
          mkdir -p .release/unpacked
          tar -xJf .release/metagreylabel-release-candidate.tar.xz -C .release/unpacked

      - name: Apply release candidate
        run: |
          node .release/unpacked/metagreylabel-release-candidate/apply-release-candidate.mjs .

      - name: Validate source and generated output
        run: |
          node --check build.mjs
          node --check js/script.js
          node build.mjs
          rm -rf dist
          BASE_PATH=/mt5-gl/ SITE_URL=https://mt5-gl.pages.dev node build.mjs
          test -f dist/index.html
          test -f dist/insights/index.html
          test -f dist/sitemap.xml
          test -f css/style.css
          test -f js/script.js
          test ! -e css/bitrader.css
          test ! -e js/bitrader.js
          test "$(find css -maxdepth 1 -type f -name '*.css' | wc -l)" -eq 1
          test "$(find js -maxdepth 1 -type f -name '*.js' | wc -l)" -eq 1

      - name: Remove staging-only files
        run: |
          rm -rf dist .release
          rm -f .github/workflows/apply-release-candidate.yml

      - name: Commit verified release to validation branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No release changes were produced."
            exit 1
          fi
          git commit -m "Complete XML-driven MetaGreyLabel static site"
          git push --force origin HEAD:refs/heads/release/metagreylabel-validated-20261119
